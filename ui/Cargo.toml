[package]
name = "asteroid-ui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
slint = { version = "1.19.0", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
i-slint-renderer-software = { version = "=1.19.0", default-features = false, features = ["experimental"] }
i-slint-core = { version = "=1.19.0", default-features = false }
embedded-alloc = { version = "0.7.0", default-features = false, features = ["tlsf"] }
zeno = { version = "0.3.3", default-features = false, features = ["eval", "libm"], optional = true }
critical-section = { version = "1.2.0", features = ["restore-state-u32"] }
libm = { version = "0.2.16", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(paint_counts)"] }

[features]
default = ["outlines"]
# Text and icons drawn from their outlines at run time: the Cortex-A build.
outlines = ["i-slint-renderer-software/systemfonts", "dep:zeno"]
# The Cortex-M build: one window drawn line by line, text and icons from distance fields made at
# build time.
mcu = []

[build-dependencies]
slint-build = { version = "1.19.0", default-features = false, features = ["compat-1-18", "renderer-software"] }
skrifa = "0.44.0"
usvg = { version = "0.48.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
incremental = false

# The Cortex-M build: the size of the generated UI code matters more than its speed.
[profile.mcu]
inherits = "release"
opt-level = "z"

# The distance fields take long to make unoptimised.
[profile.mcu.build-override]
opt-level = 2

[profile.dev]
panic = "abort"

[patch.crates-io]
i-slint-common = { path = "../third_party/slint/i-slint-common" }
i-slint-compiler = { path = "../third_party/slint/i-slint-compiler" }
i-slint-core = { path = "../third_party/slint/i-slint-core" }
i-slint-renderer-software = { path = "../third_party/slint/i-slint-renderer-software" }
slint-build = { path = "../third_party/slint/slint-build" }
