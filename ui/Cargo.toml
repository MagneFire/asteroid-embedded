[package]
name = "asteroid-ui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
i-slint-renderer-software = { version = "=1.18.1", default-features = false, features = ["experimental"] }
embedded-alloc = { version = "0.7.0", default-features = false, features = ["tlsf"] }
critical-section = { version = "1.2.0", features = ["restore-state-u32"] }

[build-dependencies]
slint-build = { version = "1.18.1", default-features = false, features = ["compat-1-18", "renderer-software"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
incremental = false

[profile.dev]
panic = "abort"
