name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
      - run: |
          mkdir out
          cp firmware-qcom/asteroid.img out/asteroid-qcom.img
          cp firmware-omap3/asteroid.img out/asteroid-omap3.img
          cp firmware-apollo3/asteroid.bin out/asteroid-apollo3.bin
          cd out && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes out/*
